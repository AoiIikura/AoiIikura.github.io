<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実践的Web開発中間課題</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
  <style>
    body {
      font-family: "Noto Sans JP",sans-serif;
      color: #000000;
      background-color: #f9f8f8;
      line-height: 2.0;     /*行間の調整*/
      font-size: 16px;
      font-weight: 300;   /*文字の太さ*/
      margin: 20px;
    }
    #characterList {
      display: flex;
      flex-wrap: wrap;    /* 入らなかったら折り返す */
      gap: 10px;      /* カード間の隙間 */
      border-top: 2px solid #afaeae;     
      padding-top: 20px;    
    }
    .character-card {
      width: 150px;
      border: 2px solid #ccc;
      border-radius: 12px;     /* 角丸の半径 */
      padding: 10px;
      margin-bottom: 10px;
      text-align: center;
      background-color: #fff;
    }
    .character-card h3{
      font-size: 14px;
      margin: 5px 0;
    }
    .shurui-filter {
      display: flex;
      gap: 10px;
    }
    .shurui-title {
      width: 100px;
      margin: 0;
    }
    .shurui-buttons {
      display: flex;
      gap: 12px;
    }
    .search-sort {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    #count {
    font-size: 15px;
    text-align: right;
    color: #555;
    }
    h1 {
      color: #333;
    }
    button {
      margin: 2px;
      padding: 2px 6px;
      font-size: 12px;
      width: 60px;
      cursor: pointer;    /* カーソルをポインターに変更 */
    }
    input[type="text"] {
      margin: 10px 0;
      padding: 5px;
      width: 600px;
      font-size: 14px;
    }
    select {
      margin: 10px 0;
      padding: 5px;
      font-size: 14px;
      width: 250px;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin-bottom: 10px;
    }
    </style>
</head>
<body>
  <h1>キャラ図鑑</h1>
  <div class="shurui-filter">
    <p class="shurui-title">タイプ</p>
    <div class="shurui-buttons">
      <button id="showAll">すべて</button>
      <button id="showFire">炎</button>
      <button id="showWater">水</button>
      <button id="showGrass">草</button>
    </div>
  </div>

  <div class="shurui-filter">
    <p class="shurui-title">レアリティ</p>
    <div class="shurui-buttons">
      <button id="showRarity1">★</button>
      <button id="showRarity2">★★</button>
      <button id="showRarity3">★★★</button>
      <button id="showRarity4">★★★★</button>
      <button id="showRarity5">★★★★★</button>
    </div>  
  </div>
<!-- 検索ボックス -->
 <div class="search-sort">
    <input type="text" id="searchInput" placeholder="キャラクター名で検索">

  <div>
    <select id="sortSelect">
      <option value="default">標準</option>
      <option value="nameAsc">名前順 (昇順)</option>
      <option value="nameDesc">名前順 (降順)</option>
      <option value="attackAsc">攻撃力順 (昇順)</option>
      <option value="attackDesc">攻撃力順 (降順)</option>
    </select>
  </div>
 </div>

  <p id="count"></p>
  <ul id="characterList"></ul>
  <script src="https://morimorihoge.github.io/teu2026f/characters.js"></script>
  <script src="main.js"></script>
</body>
</html>
