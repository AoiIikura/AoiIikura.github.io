<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実践的Web開発中間課題</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
  <style>
    body {
      font-family: "Noto Sans JP",sans-serif;
      color: #000000;
      background-color: #f9f8f8;
      line-height: 2.0;     /*行間の調整*/
      font-size: 16px;
      font-weight: 300;   /*文字の太さ*/
    }
    #characterList {
      display: flex;
      flex-wrap: wrap;    /* 入らなかったら折り返す */
      gap: 10px;      /* カード間の隙間 */
    }
    .character-card {
      width: 150px;
      border: 1px solid #ccc;
      border-radius: 5px;     /* 角丸の半径 */
      padding: 10px;
      margin-bottom: 10px;
      text-align: center;
      background-color: #fff;
    }
    .character-card h3{
      font-size: 14px;
      margin: 5px 0;
    }
    .shurui-filter {
      display: flex;
      gap: 10px;
    }
    .shurui-title {
      width: 160px;
      margin: 0;
    }
    .shurui-buttons {
      display: flex;
      gap: 12px;
    }
    h1 {
      color: #333;
    }
    button {
      margin: 4px;
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin-bottom: 10px;
    }
    </style>
</head>
<body>
  <h1>キャラ図鑑</h1>
  <div class="shurui-filter">
    <p class="shurui-title">タイプ</p>
    <div class="shurui-buttons">
      <button id="showAll">すべて</button>
      <button id="showFire">炎</button>
      <button id="showWater">水</button>
      <button id="showLightning">草</button>
    </div>
  </div>

  <div class="shurui-filter">
    <p class="shurui-title">レアリティ</p>
    <div class="shurui-buttons">
      <button id="showRarity1">★1</button>
      <button id="showRarity2">★2</button>
      <button id="showRarity3">★3</button>
      <button id="showRarity4">★4</button>
      <button id="showRarity5">★5</button>
    </div>  
  </div>
<!-- 検索ボックス -->
  <input type="text" id="searchInput" placeholder="キャラクター名で検索">

  <ul id="characterList"></ul>
  <script src="https://morimorihoge.github.io/teu2026f/characters.js"></script>
  <script src="main.js"></script>
</body>
</html>
