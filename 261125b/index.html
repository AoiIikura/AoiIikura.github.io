
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週間気温チェック</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js 4.4.1 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <style>

/* ページ全体 */
body {
  min-height: 100vh;
  background-color: #f0f0f0;
  font-family: sans-serif;
  color: #293047;
}

/* 背景の雲 */
body::before,
body::after {
  content: "☁";
  position: fixed;
  color: #dcd7f4;
  font-size: 130px;
  opacity: 0.45;
  z-index: -1;
  pointer-events: none;
}

body::before {
  top: 40px;
  left: -30px;
}

body::after {
  bottom: 20px;
  right: -25px;
}

/* メインカード */
.weather-card {
  max-width: 900px;
  background: #ffffff;
  padding: 35px;
  border-radius: 28px;
  box-shadow: 0 10px 35px rgba(91, 91, 160, 0.10);
}

/* ヘッダー */
.weather-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
}

.header-weather {
  font-size: 65px;
}

.weather-header h1 {
  font-weight: bold;
  letter-spacing: 2px;
  color: #38446f;
}

.weather-header p {
  color: #858ba5;
  margin-bottom: 0;
  font-size: 14px;
}

/* 区切り線 */
hr {
  border-color: #e5e5f3;
  opacity: 1;
  margin: 25px 0;
}

/* 地域選択 */
.area-select {
  max-width: 450px;
  margin: 0 auto 20px;
}

.form-label {
  font-weight: bold;
  color: #4c5680;
}

.form-select {
  padding: 12px;
  border: 1px solid #dcdced;
  border-radius: 2px;
  background-color: #fafaff;
}

.form-select:focus {
  border-color: #9b96dc;
  box-shadow: 0 0 0 0.2rem rgba(140, 130, 210, 0.15);
}

/* メッセージ */
.message {
  background-color: #f2f0fb;
  color: #7775bd;
  border-radius: 2px;
  padding: 12px 16px;
  margin-bottom: 20px;
  font-size: 14px;
}

/* グラフ */
.chart-container {
  width: 100%;
  height: 350px;
  position: relative;
}

/* 寒い日のカード */
.cold-box {
  margin-top: 25px;
  padding: 18px;
  border-radius: 2px;
  text-align: center;
  background-color: #f0f3ff;
  color: #5878c7;
  font-weight: bold;
  font-size: 16px;
}

/* 出典 */
footer {
  margin-top: 30px;
  text-align: center;
}

footer a {
  color: #7c83b7;
  text-decoration: none;
  font-size: 13px;
}

footer a:hover {
  text-decoration: underline;
}

/* スマホ */
@media (max-width: 576px) {
  .weather-card {
    padding: 22px 18px;
    border-radius: 20px;
  }

  .weather-header {
    gap: 10px;
  }

  .header-weather {
    font-size: 45px;
  }

  .weather-header h1 {
    font-size: 22px;
    letter-spacing: 1px;
  }

  .weather-header p {
    font-size: 12px;
  }

  .chart-container {
    height: 280px;
  }

  .cold-box {
    font-size: 14px;
  }
}

  </style>
</head>
<body>

  <div class="container py-5">
    <div class="weather-card mx-auto">

      <!-- ヘッダー -->
      <header class="weather-header">
        <div class="header-weather">☀️</div>
        <div>
          <h1>週間気温チェック</h1>
          <p>1週間の気温をチェックして、服装を決めよう！</p>
        </div>
      </header>

      <hr>

      <!-- 地域選択 -->
      <div class="area-select">
        <label for="areaSelect" class="form-label">📍 地域を選択</label>
        <select id="areaSelect" class="form-select">
          <option value="130000">東京都</option>
          <option value="140000">神奈川県</option>
          <option value="270000">大阪府</option>
          <option value="016000">北海道</option>
          <option value="400000">福岡県</option>
          <option value="471000">沖縄県</option>
        </select>
      </div>

      <!-- メッセージ -->
      <div id="message" class="message">
        気温データを読み込んでいます...
      </div>

      <!-- グラフ -->
      <div class="chart-container">
        <canvas id="temperatureChart"></canvas>
      </div>

      <!-- 寒い日 -->
      <div id="coldestDay" class="cold-box"></div>

      <!-- 出典 -->
      <footer>
        <a href="https://www.jma.go.jp/" target="_blank" rel="noopener noreferrer">
          🔗 出典：気象庁ホームページ
        </a>
      </footer>

    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
