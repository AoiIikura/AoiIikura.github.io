
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郵便番号から住所検索</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 自分のCSS -->
  <link rel="stylesheet" href="style.css">
  <style>

/* ページ全体 */
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #e9e5ff, #d6e7ff, #e3dcff);
  font-family: "Noto Sans JP", sans-serif;
  color: #303858;
  padding: 30px 15px;
}

/* カード */
.card {
  max-width: 520px;
  margin: 0 auto;
  border: none;
  border-radius: 24px;
  background-color: #ffffff;
  box-shadow: 0 15px 40px rgba(91, 91, 160, 0.15);
}

/* カード内 */
.card-body {
  padding: 35px !important;
}

/* タイトル */
h1 {
  color: #38446f;
  font-weight: bold;
  letter-spacing: 2px;
}

/* 入力欄のラベル */
.form-label {
  color: #4c5680;
  font-weight: 600;
}

/* 入力欄 */
.form-control {
  border: 1px solid #d8dcef;
  border-radius: 12px;
  padding: 12px;
  background-color: #f8f9ff;
  transition: 0.3s;
}

/* 入力欄をクリックしたとき */
.form-control:focus {
  background-color: #ffffff;
  border-color: #8b8df3;
  box-shadow: 0 0 0 0.2rem rgba(116, 112, 235, 0.15);
}

/* 検索ボタン */
.btn-primary {
  border: none;
  border-radius: 12px;
  padding: 12px;
  background: linear-gradient(135deg, #7779ed, #5968d8);
  font-weight: bold;
  letter-spacing: 1px;
  transition: 0.3s;
}

/* ボタンにカーソルを合わせたとき */
.btn-primary:hover {
  background: linear-gradient(135deg, #6567db, #4858c7);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(89, 97, 210, 0.25);
}

/* メッセージ */
#message {
  min-height: 24px;
  font-size: 14px;
  padding: 10px 14px;
  border-radius: 10px;
}

/* 成功 */
.success-message {
  color: #198754;
  background-color: #e9f8ef;
}

/* エラー */
.error-message {
  color: #dc3545;
  background-color: #fff0f1;
}

/* 検索中 */
.loading-message {
  color: #6569d9;
  background-color: #eef0ff;
}

/* 区切り線 */
hr {
  border-color: #dce1f5;
  opacity: 1;
}

/* スマホ対応 */
@media (max-width: 576px) {
  .card-body {
    padding: 22px !important;
  }

  h1 {
    font-size: 24px;
  }
}

  </style>
<body>

  <div class="container mt-5">
    <div class="card shadow-sm mx-auto">
      <div class="card-body p-4">

        <h1 class="h3 text-center mb-4">新規会員登録(住所検索)</h1>

        <!-- 郵便番号入力 -->
        <div class="mb-3">
          <label for="zipcode" class="form-label">郵便番号</label>
          <input
            type="text"
            id="zipcode"
            class="form-control"
            placeholder="例：100-0001"
          >
        </div>

        <!-- 検索ボタン -->
        <button id="searchBtn" class="btn btn-primary w-100">
          住所検索
        </button>

        <!-- メッセージ表示欄 -->
        <div id="message" class="mt-3" role="status"></div>

        <hr class="my-4">

        <!-- 住所入力欄 -->
        <div class="mb-3">
          <label for="prefecture" class="form-label">都道府県</label>
          <input type="text" id="prefecture" class="form-control">
        </div>

        <div class="mb-3">
          <label for="city" class="form-label">市区町村</label>
          <input type="text" id="city" class="form-control">
        </div>

        <div class="mb-3">
          <label for="town" class="form-label">町域</label>
          <input type="text" id="town" class="form-control">
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">番地</label>
          <input type="text" id="address" class="form-control"
            placeholder="番地を入力してください">
        </div>

      </div>
    </div>
  </div>

  <!-- 自分のJavaScript -->
  <script src="main.js"></script>
</body>
</html>
